<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFM 월드 뷰어</title>
<style>
:root {
  --bg: #0f1216; --panel: #161a20; --panel2: #1d222a; --line: #2b323c; --text: #e6eaef; --muted: #98a3af;
  --accent: #6cb4ff; --good: #5fd08a; --warn: #f2c14e; --bad: #ef6b6b; --chip: #252b34;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 10px 16px; padding: 8px 14px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
header .brand { font-weight: 700; letter-spacing: .04em; color: var(--accent); }
header .title { font-weight: 600; }
header .sub { color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav button { background: var(--chip); color: var(--text); border: 1px solid var(--line); padding: 6px 12px;
  border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
main { flex: 1; position: relative; min-height: 0; }
section.tab { position: absolute; inset: 0; display: none; }
section.tab.on { display: block; }
canvas { display: block; }
#gl, #map2d { width: 100%; height: 100%; touch-action: none; }
aside.panel { position: absolute; top: 10px; left: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto;
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; }
aside.panel h3 { margin: 10px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
aside.panel h3:first-child { margin-top: 0; }
aside.panel label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
aside.panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
aside.panel button, .btn { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; cursor: pointer; font: inherit; font-size: 12px; }
aside.panel button.on { border-color: var(--accent); color: var(--accent); }
.places { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.places div { padding: 4px 8px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.places div:hover { background: var(--panel2); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.help { position: absolute; right: 10px; bottom: 10px; max-width: 520px; background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.help b { color: var(--text); font-weight: 600; }
#tip { position: absolute; pointer-events: none; background: rgba(10,12,16,.92); color: #fff; border: 1px solid #3a4350;
  border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 300px; display: none; z-index: 5; }
#tip .k { color: #9fb6cc; font-size: 11px; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labels div { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; color: #fff;
  text-shadow: 0 0 3px #000, 0 0 3px #000; padding-bottom: 4px; }
.legend { margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend .bar { height: 8px; border-radius: 4px; margin: 4px 0; }
.scroll { position: absolute; inset: 0; overflow: auto; padding: 18px 22px 40px; }
.scroll h2 { margin: 18px 0 8px; font-size: 17px; }
.scroll h2:first-child { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card .name { font-size: 12px; color: var(--muted); }
.card .val { font-size: 22px; font-weight: 700; margin: 2px 0 6px; }
.meter { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
table { border-collapse: collapse; width: 100%; max-width: 980px; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.flag { color: var(--warn); }
.ok { color: var(--good); }
.bad { color: var(--bad); }
.muted { color: var(--muted); }
.rate { max-width: 860px; }
.rate .item { display: grid; grid-template-columns: 170px 1fr 54px; gap: 10px; align-items: center; padding: 8px 0;
  border-bottom: 1px solid var(--line); }
.rate .item .desc { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -6px; }
.rate input[type=range] { width: 100%; }
.rate .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.rate textarea, .rate input[type=text] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px; font: inherit; }
.rate textarea { min-height: 90px; }
.primary { background: var(--accent); color: #0b1220; border: none; border-radius: 6px; padding: 9px 16px; font-weight: 700;
  cursor: pointer; font: inherit; font-weight: 700; }
.note { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px;
  padding: 10px 12px; margin: 10px 0; }
.fatal { padding: 40px; font-size: 16px; }
@media (max-width: 720px) {
  aside.panel { width: calc(100% - 20px); max-height: 40%; }
  .help { display: none; }
  .rate .item { grid-template-columns: 1fr 60px; }
  .rate .item input { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header>
  <span class="brand">OFM</span>
  <span class="title" id="title">월드</span>
  <span class="sub" id="subtitle"></span>
  <nav id="tabs">
    <button data-tab="t3d" class="on">3D 보기</button>
    <button data-tab="t2d">2D 지도</button>
    <button data-tab="trep">평가 리포트</button>
    <button data-tab="trate">직접 평가하기</button>
  </nav>
</header>
<main>
  <section class="tab on" id="t3d">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <aside class="panel" id="p3d">
      <h3>카메라</h3>
      <div class="row">
        <button id="camOrbit" class="on">궤도 (1)</button>
        <button id="camWalk">걷기 (2)</button>
        <button id="camReset">처음 시점</button>
        <button id="shot">스크린샷</button>
      </div>
      <h3>표시</h3>
      <label><input type="checkbox" id="lyVolume" checked> 볼륨 메시 (동굴·아치·오버행)</label>
      <label><input type="checkbox" id="lyWater" checked> 물 (바다·호수·하천)</label>
      <label><input type="checkbox" id="lyMarkers" checked> 장소 표시</label>
      <label><input type="checkbox" id="lyLabels" checked> 이름 라벨 (L)</label>
      <label><input type="checkbox" id="lyXray"> 동굴 투시 (X)</label>
      <label><input type="checkbox" id="lyPaths"> 에이전트 이동 경로</label>
      <label><input type="checkbox" id="lyHoles"> 터레인 구멍만 강조</label>
      <div class="row muted" style="font-size:12px">높이 과장
        <input type="range" id="exag" min="1" max="3" step="0.25" value="1" style="flex:1">
        <span id="exagV">×1</span></div>
      <h3>장소로 이동</h3>
      <div class="places" id="places"></div>
    </aside>
    <div class="help" id="help3d"></div>
  </section>
  <section class="tab" id="t2d">
    <canvas id="map2d"></canvas>
    <aside class="panel" id="p2d">
      <h3>바탕 지도</h3>
      <div id="baseLayers"></div>
      <div class="legend" id="legend"></div>
      <h3>겹쳐 보기</h3>
      <label><input type="checkbox" id="ovPois" checked> 장소 (POI)</label>
      <label><input type="checkbox" id="ovFeatures" checked> 암석 지형</label>
      <label><input type="checkbox" id="ovCaves" checked> 동굴 통로</label>
      <label><input type="checkbox" id="ovRivers" checked> 하천</label>
      <label><input type="checkbox" id="ovPaths"> 에이전트 이동 경로</label>
      <label><input type="checkbox" id="ovRegions"> 평가 지역 격자</label>
      <label><input type="checkbox" id="ovNames" checked> 이름</label>
      <div class="row"><button id="mapFit">전체 보기</button></div>
      <div class="muted" style="font-size:12px;margin-top:6px">드래그: 이동 · 휠: 확대 · 지점 위에 올리면 정보</div>
    </aside>
  </section>
  <section class="tab" id="trep"><div class="scroll" id="report"></div></section>
  <section class="tab" id="trate"><div class="scroll"><div class="rate" id="rate"></div></div></section>
  <div id="tip"></div>
</main>
<script src="viewer_data.js"></script>
<script>
(function () {
'use strict';
const D = window.OFM_DATA;
if (!D) {
  document.body.innerHTML = '<div class="fatal">viewer_data.js를 읽지 못했습니다. viewer.html과 같은 폴더에 viewer_data.js가 있어야 합니다.</div>';
  return;
}
const W = D.world, E = D.evaluation || {}, T = D.terrain;
const EXT = W.extent_m, SEA = W.sea_level;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = (v, d = 1) => (v == null || Number.isNaN(v)) ? '–' : Number(v).toFixed(d);

const LABELS = {
  scenic: ['경관 선호', '보기 좋은 풍경인가 (Kaplan 선호 모델)'],
  variety: ['다양성', '지형·바이옴·볼거리가 다채로운가'],
  mystery: ['미스터리', '가려진 곳 너머가 궁금해지는가'],
  prospect_refuge: ['조망-피신', '멀리 내다볼 곳과 몸을 숨길 곳이 고루 있는가'],
  terrain_quality: ['지형 품질', '지형이 자연스럽고 눈에 띄는 결함이 없는가'],
  pacing: ['페이싱', '돌아다니는 동안 볼거리가 적당한 간격으로 나오는가'],
  exploration: ['탐험', '돌아다니며 발견할 것이 충분한가'],
  legibility: ['랜드마크 가독성', '눈에 띄는 랜드마크로 내 위치를 알 수 있는가'],
  orientation: ['방향 감각', '길을 잃거나 같은 길을 되돌아가지 않고 다닐 수 있는가'],
  overall: ['종합', '오픈월드 맵으로서 전체적으로 흥미로운가'],
};
const KIND_KO = {
  settlement: '마을', summit: '정상', lakeshore: '호숫가', waterfall: '폭포', confluence: '합류점', cove: '만',
  rock_formation: '암석 지형', cave_entrance: '동굴 입구', camp: '야영지', ruin: '유적', viewpoint: '전망대',
  spire: '첨탑', arch: '아치', butte: '뷰트', monolith: '선돌', sea_stack: '해식주', sinkhole: '싱크홀', spring: '샘',
  grotto: '굴 입구', sea_cave: '해식동굴 입구', sea: '해식동굴', karst: '카르스트', fissure: '균열', peak: '봉우리', spawn: '출발점',
};
const KIND_COLOR = {
  settlement: [255, 170, 60], summit: [240, 240, 240], lakeshore: [110, 220, 230], waterfall: [150, 210, 255],
  confluence: [90, 150, 255], cove: [80, 200, 170], rock_formation: [235, 110, 235], cave_entrance: [255, 220, 60],
  feature: [235, 110, 235], cave: [255, 220, 60], spawn: [90, 230, 110], falls: [150, 210, 255], other: [255, 120, 120],
};
const PROFILE_COLORS = [[255, 120, 90], [90, 200, 255], [250, 210, 80], [170, 140, 255], [120, 230, 140], [255, 140, 210]];
const kindKo = (k) => KIND_KO[k] || k;
const kindCol = (k) => KIND_COLOR[k] || KIND_COLOR.other;
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------------------------------------------------------------- decoding
function bytes(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
const u16 = (s) => { const b = bytes(s); return new Uint16Array(b.buffer, 0, b.length >> 1); };
const u32 = (s) => { const b = bytes(s); return new Uint32Array(b.buffer, 0, b.length >> 2); };
const f32 = (s) => { const b = bytes(s); return new Float32Array(b.buffer, 0, b.length >> 2); };

// ---------------------------------------------------------------- header
$('title').textContent = W.name || '월드';
const sc = (E.scores || {});
$('subtitle').textContent = `시드 ${W.seed} · ${(EXT / 1000).toFixed(1)} km × ${(EXT / 1000).toFixed(1)} km · ` +
  `동굴 ${W.caves.length} · 호수 ${W.lakes.length} · 하천 ${W.rivers.length} · 장소 ${W.pois.length}` +
  (sc.overall != null ? ` · 시뮬레이션 종합 ${fmt(sc.overall, 2)}/10` : '');
document.title = `OFM · ${W.name} (시드 ${W.seed})`;

// ---------------------------------------------------------------- tabs
let active = 't3d';
for (const b of document.querySelectorAll('#tabs button')) {
  b.addEventListener('click', () => {
    for (const x of document.querySelectorAll('#tabs button')) x.classList.toggle('on', x === b);
    for (const s of document.querySelectorAll('section.tab')) s.classList.toggle('on', s.id === b.dataset.tab);
    active = b.dataset.tab;
    if (active === 't3d') { resize3d(); dirty = true; }
    if (active === 't2d') { resize2d(); draw2d(); }
  });
}

// ---------------------------------------------------------------- terrain (CPU copy)
const N = T.n, SP = T.spacing;
const H = new Float32Array(N * N);
{ const q = u16(T.h), k = (T.hmax - T.hmin) / 65535; for (let i = 0; i < N * N; i++) H[i] = T.hmin + q[i] * k; }
function groundAt(x, y) {
  const u = Math.min(Math.max(x / SP, 0), N - 1.0001), v = Math.min(Math.max(y / SP, 0), N - 1.0001);
  const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j, a = j * N + i;
  return (H[a] * (1 - fu) + H[a + 1] * fu) * (1 - fv) + (H[a + N] * (1 - fu) + H[a + N + 1] * fu) * fv;
}

// ---------------------------------------------------------------- markers (shared by 3D and 2D)
const markers = [];
for (const p of W.pois) {
  markers.push({ type: 'poi', kind: p.kind, name: p.name || kindKo(p.kind), desc: p.description, x: p.x, y: p.y, z: p.z,
    imp: p.importance, col: kindCol(p.kind), extra: `지역 ${p.region || '-'} · 중요도 ${fmt(p.importance, 2)}${p.source !== 'procedural' ? ' · ' + p.source : ''}` });
}
for (const f of W.features) {
  markers.push({ type: 'feature', kind: f.kind, name: f.name || kindKo(f.kind), desc: f.description, x: f.x, y: f.y,
    z: f.z + f.height, base: f.z, imp: 0.9, col: kindCol('feature'), extra: `높이 ${fmt(f.height, 0)} m · 반경 ${fmt(f.radius, 0)} m` });
}
for (const c of W.caves) {
  for (const e of c.entrances) {
    markers.push({ type: 'cave', kind: e.kind, name: (c.name || c.id) + ' · ' + kindKo(e.kind), desc: c.description,
      x: e.x, y: e.y, z: e.z, imp: 0.8, col: kindCol('cave'), extra: `${kindKo(c.kind)} 동굴 · 길이 ${fmt(c.length_m, 0)} m` });
  }
}
for (const f of (W.waterfalls || [])) {
  markers.push({ type: 'falls', kind: 'waterfall', name: '폭포', desc: '', x: f.x, y: f.y, z: f.top, imp: 0.6,
    col: kindCol('falls'), extra: `낙차 ${fmt(f.drop, 1)} m` });
}
if (W.spawn) {
  markers.push({ type: 'spawn', kind: 'spawn', name: '출발점', desc: '플레이테스트 에이전트가 출발한 곳(플레이어 시작 위치로 쓰기 좋음)',
    x: W.spawn.x, y: W.spawn.y, z: W.spawn.z, imp: 1.0, col: kindCol('spawn'), extra: '' });
}
// duplicates: a cave_entrance POI and its cave mouth are the same place
const seen = new Set();
for (const m of markers) {
  const key = `${Math.round(m.x / 3)}_${Math.round(m.y / 3)}`;
  if (m.type === 'cave' && seen.has(key)) m.dup = true;
  if (m.type === 'poi' && m.kind === 'cave_entrance') seen.add(key);
}
function tipHtml(m) {
  return `<b>${esc(m.name)}</b><div class="k">${esc(kindKo(m.kind))}${m.extra ? ' · ' + esc(m.extra) : ''}</div>` +
    (m.desc ? `<div>${esc(m.desc)}</div>` : '') +
    `<div class="k">x ${fmt(m.x, 0)} · y ${fmt(m.y, 0)} · 높이 ${fmt(m.base != null ? m.base : m.z, 1)} m</div>`;
}
const tip = $('tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = 'block';
  const r = tip.getBoundingClientRect(), mw = window.innerWidth, mh = window.innerHeight;
  tip.style.left = Math.min(x + 14, mw - r.width - 6) + 'px';
  tip.style.top = Math.min(y + 14, mh - r.height - 6) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

// agent paths as world points
const agentPaths = [];
if (D.agents) {
  const G = D.agents.grid, cs = D.agents.cell;
  const profiles = [...new Set(D.agents.paths.map((p) => p.profile))];
  for (const p of D.agents.paths) {
    const cells = u32(p.cells), pts = [];
    for (const c of cells) pts.push([(c % G + 0.5) * cs, (Math.floor(c / G) + 0.5) * cs]);
    agentPaths.push({ profile: p.profile, run: p.run, bored: p.bored, pts, col: PROFILE_COLORS[profiles.indexOf(p.profile) % PROFILE_COLORS.length] });
  }
}

if (location.hash === '#rate' || location.hash === '#report' || location.hash === '#map') {
  const t = { '#rate': 'trate', '#report': 'trep', '#map': 't2d' }[location.hash];
  setTimeout(() => document.querySelector(`#tabs button[data-tab="${t}"]`).click(), 0);
}

// ================================================================= 3D
const canvas = $('gl');
const gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: false });
let dirty = true;
let resize3d = () => {};
if (!gl) {
  $('t3d').innerHTML = '<div class="fatal">이 브라우저는 WebGL2를 지원하지 않습니다. 최신 Chrome, Edge, Firefox, Safari에서 열어 주세요. 2D 지도와 리포트 탭은 사용할 수 있습니다.</div>';
} else {
  init3d();
}

function init3d() {
  // ---- tiny matrix helpers (column-major)
  const M = {
    persp(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
      return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]); },
    look(e, c, u) {
      let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
      let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
        -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]); },
    mul(a, b) { const o = new Float32Array(16);
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; }
      return o; },
  };

  // ---- shaders
  function prog(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {

  const studio = location.protocol.startsWith('http') && /\/worlds\/([^/]+)\//.test(location.pathname);
  let h = '<h2>직접 평가하기</h2>';
  h += '<div class="note">3D 보기(특히 <b>걷기 모드</b>)와 2D 지도로 월드를 충분히 둘러본 뒤 항목마다 0–10점을 매겨 주세요. ' +
    '<b>시뮬레이션 점수는 저장한 뒤에 보여 드립니다</b>(먼저 보면 판단이 끌려갑니다). 사람 점수와 시뮬레이션 점수의 차이는 평가 모델을 보정하는 데 씁니다.</div>';
  for (const k of keys) {
    const v = draft.ratings && draft.ratings[k] != null ? draft.ratings[k] : 5;
    h += `<div class="item"><b>${esc(LABELS[k][0])}</b><input type="range" min="0" max="10" step="0.5" value="${v}" data-k="${k}"><span class="v" id="rv_${k}">${fmt(v, 1)}</span>` +
      `<div class="desc">${esc(LABELS[k][1])}</div></div>`;
  }
  h += `<h2>메모</h2><textarea id="rateNotes" placeholder="좋았던 곳, 어색했던 곳(위치나 장소 이름을 함께 적어 주세요), 버그 등">${esc(draft.notes || '')}</textarea>`;
  h += `<div class="row" style="display:flex;gap:10px;margin-top:10px;align-items:center"><input type="text" id="rateWho" placeholder="평가자 이름(선택)" value="${esc(draft.tester || '')}" style="max-width:260px">` +
    `<button class="primary" id="rateSave">${studio ? '저장' : '평가 파일로 저장'}</button><span class="muted" id="rateMsg"></span></div>`;
  h += '<div id="rateCompare"></div>';
  R.innerHTML = h;
  const collect = () => {
    const ratings = {}; for (const el of R.querySelectorAll('input[type=range]')) ratings[el.dataset.k] = +el.value;
    return { format: 'ofm-feedback', version: 1, world: W.name, seed: W.seed, created: W.created, rated_at: new Date().toISOString(),
      tester: $('rateWho').value.trim(), ratings, notes: $('rateNotes').value, simulation: sc };
  };
  const saveDraft = () => { try { localStorage.setItem(storeKey, JSON.stringify(collect())); } catch (e) { /* private mode */ } };
  for (const el of R.querySelectorAll('input[type=range]')) el.oninput = () => { $('rv_' + el.dataset.k).textContent = fmt(+el.value, 1); saveDraft(); };
  $('rateNotes').oninput = saveDraft; $('rateWho').oninput = saveDraft;
  function compare(fb) {
    let h = '<h2>사람 vs 시뮬레이션</h2><table><tr><th>항목</th><th class="num">사람</th><th class="num">시뮬레이션</th><th class="num">차이</th></tr>';
    let sum = 0, n = 0;
    for (const k of keys) {
      const a = fb.ratings[k], b = sc[k]; const d = b == null ? null : a - b;
      if (d != null) { sum += Math.abs(d); n++; }
      h += `<tr><td>${esc(LABELS[k][0])}</td><td class="num">${fmt(a, 1)}</td><td class="num">${fmt(b, 2)}</td><td class="num ${d == null ? '' : Math.abs(d) >= 2 ? 'bad' : Math.abs(d) >= 1 ? 'flag' : 'ok'}">${d == null ? '–' : (d > 0 ? '+' : '') + fmt(d, 2)}</td></tr>`;
    }
    h += `</table><p class="muted">평균 절대 차이 ${n ? fmt(sum / n, 2) : '–'}점. 차이가 2점 이상인 항목은 시뮬레이션이 사람의 느낌을 놓치고 있다는 신호입니다.</p>`;
    $('rateCompare').innerHTML = h;
  }
  $('rateSave').onclick = async () => {
    const fb = collect(); saveDraft();
    let saved = false;
    if (studio) {
      try {
        const world = location.pathname.match(/\/worlds\/([^/]+)\//)[1];
        const r = await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ world: decodeURIComponent(world), feedback: fb }) });
        saved = r.ok; if (saved) $('rateMsg').textContent = '스튜디오에 저장했습니다 (feedback.json).';
      } catch (e) { saved = false; }
    }
    if (!saved) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(fb, null, 1)], { type: 'application/json' }));
      a.download = `feedback_${W.name}_${W.seed}.json`; a.click();
      $('rateMsg').textContent = '평가 파일을 내려받았습니다. 월드 폴더에 넣거나 개발자에게 보내 주세요.';
    }
    compare(fb);
  };
})();
})();
</script>
</body>
</html>
